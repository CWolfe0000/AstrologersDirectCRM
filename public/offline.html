<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · AstrologersDirect</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F5F1; color: #29272B;
         font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 380px; }
  .mark { display: inline-flex; width: 44px; height: 44px; border-radius: 10px; background: #29272B; color: #F7F5F1; align-items: center; justify-content: center;
          font-family: Georgia, serif; font-size: 26px; margin-bottom: 20px; }
  h1 { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; font-size: 30px; margin: 0 0 10px; }
  p { color: #68645F; font-size: 15px; line-height: 1.55; margin: 0 0 22px; }
  a { display: inline-block; background: #824B59; color: #fff; text-decoration: none; padding: 11px 22px; border-radius: 8px; font-weight: 500; font-size: 14px; }
  a:focus-visible { outline: 2px solid #29272B; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">A</div>
  <h1>You’re offline</h1>
  <p>AstrologersDirect needs a connection to load your practice. Your saved work is safe — reconnect and try again.</p>
  <a href="javascript:location.reload()">Try again</a>
</main>
</body>
</html>
