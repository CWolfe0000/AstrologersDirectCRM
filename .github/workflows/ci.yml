name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astrologersdirect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/astrologersdirect
      # Test-only key. Never reuse outside CI.
      APP_ENCRYPTION_KEY: dGVzdC1rZXktdGVzdC1rZXktdGVzdC1rZXktdGVzdDA=
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_DATA_MODE: server
      CRON_SECRET: ci-only-cron-secret
      CONTACT_EMAIL: hello@example.com
      ADMIN_EMAILS: admin-e2e@example.com
      # Many test accounts are created from one address; never set this in production.
      RATE_LIMIT_MULTIPLIER: "20"
      # Swiss Ephemeris in non-commercial test mode; data files downloaded below.
      SWISS_EPHEMERIS_LICENSE: staging
      # Test sign-ups get Premium so every screen is exercised; tests/e2e/premium.mjs checks the standard plan.
      DEFAULT_PLAN: premium
      # Payments run against a stand-in for Stripe started by tests/e2e/payments.mjs.
      STRIPE_SECRET_KEY: sk_test_mock
      STRIPE_API_BASE: http://127.0.0.1:4010
      STRIPE_WEBHOOK_SECRET: whsec_test_e2e
      # Calls run against a stand-in for Daily started by tests/e2e/calls.mjs.
      DAILY_API_KEY: mock
      DAILY_API_BASE: http://127.0.0.1:4011
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download Swiss Ephemeris data files (checksum-verified)
        run: npm run ephemeris
      - name: Type check (includes UI ↔ server schema drift check)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migrate database
        run: npm run db:migrate
      - name: Build
        run: npm run build
      - name: Install browser for end-to-end test
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: End-to-end smoke test
        run: |
          npm start &
          npx --yes wait-on@8 http://localhost:3000 --timeout 60000
          npm run test:e2e
          node tests/e2e/flows.mjs
          node tests/e2e/files.mjs
          node tests/e2e/recording.mjs
          node tests/e2e/twofactor.mjs
          node tests/e2e/conflicts.mjs
          node tests/e2e/practice-tools.mjs
          node tests/e2e/timeline.mjs
          node tests/e2e/premium.mjs
          node tests/e2e/client-work.mjs
          node tests/e2e/work-reminders.mjs
          node tests/e2e/email-signin.mjs
          node tests/e2e/multi-practice.mjs
          node tests/e2e/contact.mjs
          node tests/e2e/admin.mjs
          node tests/e2e/access.mjs
          node tests/e2e/portal-account.mjs
          node tests/e2e/chart-people.mjs
          node tests/e2e/horary-acg.mjs
          node tests/e2e/elect.mjs
          node tests/e2e/rectify.mjs
          node tests/e2e/promise.mjs
          node tests/e2e/forecast.mjs
          node tests/e2e/portal-messages.mjs
          node tests/e2e/intake.mjs
          node tests/e2e/onboarding.mjs
          node tests/e2e/asteroids.mjs
          node tests/e2e/share-cards.mjs
          node tests/e2e/payments.mjs
          node tests/e2e/calls.mjs
          node tests/e2e/booking.mjs
          node tests/e2e/pwa.mjs
          node tests/e2e/a11y.mjs
          node tests/e2e/a11y.mjs --mobile
      - name: Standalone demo build still works
        run: npm run build:standalone
